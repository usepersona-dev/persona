# Types, lint and unit tests on every pull request and every push to main. No secrets, so pull requests from forks run safely.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter webapp --filter landing --filter docs exec next typegen
      - run: pnpm --filter docs exec fumadocs-mdx
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
