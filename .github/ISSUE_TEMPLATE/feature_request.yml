name: Feature request
description: An idea for Persona. For a bigger change, agree on its shape here before you write it.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you want to do, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How Persona could solve it.
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: Other ways you thought of
